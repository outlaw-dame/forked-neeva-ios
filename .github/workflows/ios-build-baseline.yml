name: iOS build baseline

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-build-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Simulator build baseline
    runs-on: macos-14
    timeout-minutes: 90
    env:
      SKIP_SWIFT_FORMAT_BUILD: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'package.json'

      - name: Restore Carthage cache
        uses: actions/cache@v4
        id: carthage-cache
        with:
          path: |
            ~/Library/Caches/org.carthage.CarthageKit
            Carthage/Build
          key: carthage-${{ runner.os }}-${{ hashFiles('Cartfile.resolved') }}
          restore-keys: |
            carthage-${{ runner.os }}-

      - name: Install Carthage
        run: brew install carthage

      - name: Verify shared Client scheme exists
        run: |
          ls Client.xcodeproj/xcshareddata/xcschemes
          test -f Client.xcodeproj/xcshareddata/xcschemes/Client.xcscheme

      - name: Bootstrap dependencies
        if: steps.carthage-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: ./bootstrap.sh

      - name: Dependencies restored from cache
        if: steps.carthage-cache.outputs.cache-hit == 'true'
        run: echo "Carthage cache hit — skipping bootstrap"

      - name: Build Client for simulator without signing
        timeout-minutes: 45
        run: |
          xcodebuild \
            -project Client.xcodeproj \
            -scheme Client \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build
